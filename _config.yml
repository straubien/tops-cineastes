# ---------------------------------------------------------------------------
#  TOPS / CINEASTES - reglages Jekyll
#
#  Le numero de version des fichiers (le "?v=..." des balises <script> et
#  <link>) n'est PLUS ecrit ici. Il est calcule automatiquement par Jekyll a
#  chaque construction du site, a partir de l'heure de construction.
#
#  Concretement : il n'y a plus rien a incrementer avant de publier. Chaque
#  envoi sur GitHub reconstruit le site et produit un numero neuf, donc les
#  visiteurs de retour recoivent toujours vos fichiers a jour.
#
#  Voir le point A-12 de l'audit.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
#  ADRESSE DE CONTACT DES PAGES LEGALES
#
#  C'est le SEUL endroit a modifier pour changer d'adresse. Les deux pages
#  legales et contact.js la reprennent d'ici, automatiquement.
#
#  Elle est coupee en trois morceaux : le code des pages ne contient donc
#  jamais d'adresse complete, et les robots a spam, qui cherchent le signe
#  arobase dans le code source, passent a cote. contact.js la recompose au
#  moment de l'affichage.
#
#  Pour « prenom.nom@gmail.com » :   compte: prenom.nom
#                                    domaine: gmail
#                                    ext: com
#
#  ATTENTION : pas de guillemets, pas d'espace avant les deux-points, un
#  seul espace apres. Ne changez QUE ce qui suit les deux-points.
# ---------------------------------------------------------------------------
courriel_compte: matmuzard
courriel_domaine: gmail
courriel_ext: com

# ---------------------------------------------------------------------------
#  DATE DE DERNIERE REVISION DES PAGES LEGALES
#
#  A changer A LA MAIN, et seulement quand vous modifiez vraiment le texte de
#  la page concernee.
#
#  Avant, ces pages affichaient la date de construction du site : elles
#  annoncaient donc une mise a jour a chaque envoi sur GitHub, meme quand le
#  texte n'avait pas bouge d'une virgule. Sur une page qui engage, c'est une
#  information fausse.
#
#  Format : JJ/MM/AAAA, tel qu'il s'affichera a l'ecran.
# ---------------------------------------------------------------------------
maj_confidentialite: 01/10/2026
maj_mentions_legales: 01/10/2026

# ---------------------------------------------------------------------------
#  FICHIERS A NE PAS PUBLIER
#
#  Jekyll publie TOUT ce qui ne commence pas par un tiret bas ou un point.
#  Sans cette liste, les fichiers d'outillage (package.json, la configuration
#  du linter, le mode d'emploi) se retrouvaient servis sur le site public :
#  ils n'ont rien de secret, mais ils n'ont rien a y faire non plus.
#
#  Les dossiers _outils/ et _tests/ sont deja ignores : ils commencent par un
#  tiret bas. Idem pour .gitignore et .github/, qui commencent par un point.
#
#  ATTENTION : declarer « exclude » REMPLACE la liste par defaut de Jekyll.
#  Les entrees ci-dessous reprennent donc cette liste par defaut, puis y
#  ajoutent les notres. Si vous ajoutez une ligne, ne supprimez pas les autres.
# ---------------------------------------------------------------------------
exclude:
  # --- reprise de la liste par defaut de Jekyll ---
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # --- outillage des controles automatiques (audit B, vague 2) ---
  - package.json
  - package-lock.json
  - eslint.config.mjs
  - README.md
